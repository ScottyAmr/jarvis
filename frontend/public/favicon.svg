<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#0d1521"/>
    </linearGradient>
    <radialGradient id="orbCore" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#eafcff"/>
      <stop offset="18%" stop-color="#8ff0ff"/>
      <stop offset="45%" stop-color="#2fb8e6"/>
      <stop offset="75%" stop-color="#1573a8"/>
      <stop offset="100%" stop-color="#0a3a5c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4fd8ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4fd8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- macOS-style rounded-square background -->
  <rect x="52" y="52" width="920" height="920" rx="204" ry="204" fill="url(#bg)"/>

  <!-- outer ambient glow -->
  <circle cx="512" cy="512" r="360" fill="url(#orbGlow)"/>

  <!-- arc-reactor style rings -->
  <circle cx="512" cy="512" r="300" fill="none" stroke="#2fb8e6" stroke-opacity="0.35" stroke-width="4" filter="url(#blur2)"/>
  <circle cx="512" cy="512" r="255" fill="none" stroke="#7fe8ff" stroke-opacity="0.5" stroke-width="3"/>
  <circle cx="512" cy="512" r="255" fill="none" stroke="#7fe8ff" stroke-opacity="0.85"
          stroke-width="6" stroke-dasharray="140 60 90 90" stroke-linecap="round"/>

  <!-- core orb -->
  <circle cx="512" cy="512" r="190" fill="url(#orbCore)"/>
  <circle cx="512" cy="440" r="60" fill="#ffffff" opacity="0.55" filter="url(#blur1)"/>
</svg>
